# ──────────────────────────────────────────────────────────────────────
# concord_adk.yml
#
# Concord pipeline that delegates ALL LLM work to an external
# `adk api_server` via its /run endpoint.
#
# This is the counterpart to concord.yml (which embeds InMemoryRunner).
# Use this file when you want to run the ADK server as a shared service
# (e.g., a k8s Deployment) and have Concord jobs call into it over HTTP.
#
# Architecture:
#   Concord task container
#     └─ concord_adk_runner.py
#          ├─ git clone <module repo>
#          ├─ collect all .pp/.rb/.yaml/.erb files
#          ├─ POST /run → adk api_server (separate host/pod)
#          │    └─ runs migrator_pattern SequentialAgent
#          │         DeepAnalyzer → CodeMigrator → MigrationReviewer → Finalizer
#          ├─ parse "--- FILE: ---" blocks from /run response
#          ├─ write migrated files back to clone
#          └─ git checkout -b / add / commit / push
#
# Required Concord Secrets (set at Organisation or Project level):
#   googleApiKey   — Google AI Studio or Vertex AI key (used by the ADK server, not Concord)
#   gitToken       — GitHub PAT with repo:read + repo:write + create_branch permissions
#
# Required argument / form field:
#   adkServerUrl   — http(s) URL of the running adk api_server, e.g.
#                    http://puppet8-adk.internal:8090
#
# ──────────────────────────────────────────────────────────────────────

configuration:
  runtime: "concord-v2"

  arguments:
    # ── Pipeline target ──────────────────────────────────────────────
    repoUrl:        "https://github.com/myorg/puppet-webapp.git"
    sourceBranch:   "main"
    targetBranch:   ""          # empty = auto-generated by runner
    modulePath:     "."         # "." means repo root IS the module
                                # set to e.g. "modules/webapp" for control repos

    # ── ADK server ───────────────────────────────────────────────────
    adkServerUrl:   "http://localhost:8090"   # override in your environment
    adkAppName:     "migrator_pattern"        # which agent to invoke
    adkStream:      false                     # true = /run_sse (streaming)
    adkTimeout:     600                       # seconds to wait for /run response

    # ── Migration tool source ────────────────────────────────────────
    migrationToolRepo:   "https://github.com/myorg/puppet8-migrator.git"
    migrationToolBranch: "main"

    # ── Behaviour flags ──────────────────────────────────────────────
    pushResults: true    # false = dry-run (commit locally, don't push)

# ──────────────────────────────────────────────────────────────────────
# Forms — shown in the Concord UI when triggering manually
# ──────────────────────────────────────────────────────────────────────

forms:
  migrationParams:
    - repoUrl:
        label: "Puppet Module Repository URL"
        type:  "string"
        allow: "^https://.*\\.git$"
    - sourceBranch:
        label: "Source Branch"
        type:  "string"
        value: "main"
    - targetBranch:
        label: "Target Branch (leave blank for auto-generated)"
        type:  "string"
        value: ""
    - modulePath:
        label: "Module Path within Repo (. = root)"
        type:  "string"
        value: "."
    - adkServerUrl:
        label: "ADK api_server URL"
        type:  "string"
        value: "http://puppet8-adk.internal:8090"
    - adkAppName:
        label: "ADK App / Agent Pattern"
        type:  "string"
        value: "migrator_pattern"
        allow: "^(analyzer_pattern|migrator_pattern|validator_pattern|coordinator_pattern)$"
    - pushResults:
        label: "Push migrated branch to origin?"
        type:  "boolean"
        value: true

# ──────────────────────────────────────────────────────────────────────
# Profiles
# ──────────────────────────────────────────────────────────────────────

profiles:
  # Full migration + push (default)
  migrate:
    configuration:
      arguments:
        adkAppName:  "migrator_pattern"
        pushResults: true

  # Analysis only — no code changes, no push
  analyze:
    configuration:
      arguments:
        adkAppName:  "analyzer_pattern"
        pushResults: false

  # Iterative validator — loop until all Puppet 8 checks pass, then push
  validate:
    configuration:
      arguments:
        adkAppName:  "validator_pattern"
        pushResults: true

  # Dry-run — migrate but do NOT push
  dryrun:
    configuration:
      arguments:
        pushResults: false

  # SSE streaming mode — useful for long-running migrations with live logs
  streaming:
    configuration:
      arguments:
        adkStream: true

# ──────────────────────────────────────────────────────────────────────
# Flows
# ──────────────────────────────────────────────────────────────────────

flows:

  default:
    - call: adkMigration

  # ────────────────────────────────────────────────────────────────────
  # Core flow: health-check ADK server → run migration → report
  # ────────────────────────────────────────────────────────────────────
  adkMigration:

    # Step 0: Announce
    - log: "=== Puppet 7→8 Migration via ADK api_server ==="
    - log: "ADK server : ${adkServerUrl}"
    - log: "Agent      : ${adkAppName}"
    - log: "Repo       : ${repoUrl}  (branch: ${sourceBranch})"
    - log: "Module path: ${modulePath}"
    - log: "Push       : ${pushResults}"

    # Step 1: Verify the ADK api_server is reachable before doing any git work.
    #         Fail fast so Concord shows a clear error rather than a mysterious
    #         timeout 10 minutes into the job.
    - task: http
      in:
        method:         "GET"
        url:            "${adkServerUrl}/health"
        connectTimeout: 10
        readTimeout:    15
        ignoreErrors:   true
      out:
        healthCheck: "${result}"

    - if: "${healthCheck.statusCode != 200}"
      then:
        - log: "ADK api_server health check FAILED (status ${healthCheck.statusCode})"
        - log: "Ensure the ADK server is running: adk api_server --port 8090"
        - throw: "ADK api_server not reachable at ${adkServerUrl}"
      else:
        - log: "ADK api_server is healthy ✓"

    # Step 2: Clone the migration tool and install its dependencies.
    - task: script
      in:
        body: |
          #!/bin/bash
          set -euo pipefail

          echo "=== Cloning puppet8-migrator tool ==="
          git clone --depth 1 --branch "${migrationToolBranch}" \
            "${migrationToolRepo}" /tmp/puppet8-migrator

          echo "=== Installing Python dependencies ==="
          python3 -m venv /tmp/puppet8-venv
          source /tmp/puppet8-venv/bin/activate

          # Only needs requests-style stdlib — no google-adk needed here
          # because the heavy lifting is done by the remote ADK server.
          pip install --quiet python-dotenv

          echo "=== Setup complete ==="

    # Step 3: Run the migration via concord_adk_runner.py.
    #
    #   The runner:
    #     a) Clones ${repoUrl}@${sourceBranch}
    #     b) Collects all Puppet files into a single prompt string
    #     c) POSTs the prompt to ${adkServerUrl}/run  (or /run_sse)
    #     d) Parses "--- FILE: --- / --- END FILE: ---" blocks from response
    #     e) Writes migrated files back to the clone
    #     f) git checkout -b / add -A / commit / push (if pushResults=true)
    #
    #   Exit codes:
    #     0 — success
    #     1 — failure
    #     2 — no changes (module already Puppet 8 compatible)
    - task: script
      in:
        body: |
          #!/bin/bash
          set -euo pipefail

          source /tmp/puppet8-venv/bin/activate
          cd /tmp/puppet8-migrator

          export GIT_TOKEN="${crypto.exportAsString('gitToken', 'gitToken')}"
          export GIT_AUTHOR_NAME="puppet8-migrator-concord"
          export GIT_AUTHOR_EMAIL="puppet8-migrator@noreply"
          export ADK_SERVER_URL="${adkServerUrl}"
          export CONCORD_REPORT_DIR="${workDir}/_attachments"

          # Build the runner command
          CMD="python concord_adk_runner.py"
          CMD="${CMD} --adk-url '${adkServerUrl}'"
          CMD="${CMD} --app-name '${adkAppName}'"
          CMD="${CMD} --repo-url '${repoUrl}'"
          CMD="${CMD} --source-branch '${sourceBranch}'"
          CMD="${CMD} --module-path '${modulePath}'"
          CMD="${CMD} --timeout ${adkTimeout}"

          if [ -n "${targetBranch}" ]; then
            CMD="${CMD} --target-branch '${targetBranch}'"
          fi

          if [ "${adkStream}" = "true" ]; then
            CMD="${CMD} --stream"
          fi

          if [ "${pushResults}" = "true" ]; then
            CMD="${CMD} --push"
          fi

          echo "=== Executing ==="
          echo "${CMD}"
          eval ${CMD}
          EXIT_CODE=$?

          echo "EXIT_CODE=${EXIT_CODE}" > /tmp/migration_exit_code
          exit ${EXIT_CODE}
      out:
        migrationExitCode: "${result.exitCode}"
      error:
        - expr: "${result.exitCode}"
          out: migrationExitCode

    # Step 4: Evaluate outcome and emit appropriate Concord status.
    - switch: "${migrationExitCode}"
      case:
        0:
          - log: "✅ Migration completed successfully."
          - log: "Migrated branch has been pushed to origin."
        2:
          - log: "ℹ️  No changes were made."
          - log: "The module appears to already be Puppet 8 compatible."
        default:
          - log: "❌ Migration failed (exit code: ${migrationExitCode})"
          - log: "Check the Concord task log and migration_report.json attachment."
          - throw: "Puppet 8 migration failed with exit code ${migrationExitCode}"

  # ────────────────────────────────────────────────────────────────────
  # Batch flow — iterate over a list of modules
  #
  # Trigger with a 'moduleList' argument shaped like:
  #   moduleList:
  #     - repoUrl: https://github.com/myorg/puppet-nginx.git
  #       sourceBranch: main
  #       modulePath: .
  #     - repoUrl: https://github.com/myorg/puppet-control.git
  #       sourceBranch: production
  #       modulePath: modules/webapp
  # ────────────────────────────────────────────────────────────────────
  batchAdkMigration:
    - log: "=== Batch ADK Migration: ${moduleList.size()} modules ==="
    - call: adkMigration
      withItems: "${moduleList}"
      in:
        repoUrl:      "${item.repoUrl}"
        sourceBranch: "${item.sourceBranch}"
        modulePath:   "${item.modulePath}"
      retry:
        times: 2
        delay: 30

# ──────────────────────────────────────────────────────────────────────
# Triggers (uncomment to activate)
# ──────────────────────────────────────────────────────────────────────

